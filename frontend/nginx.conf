server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router can handle it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively; index.html must not be, so SPA updates land immediately
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
