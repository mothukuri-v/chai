# Production overlay — adds a Caddy reverse proxy with automatic HTTPS. The base
# compose file no longer publishes any host ports, so this is the only thing that
# makes the stack reachable from outside the box. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Do NOT combine this with docker-compose.dev.yml — pick one or the other.
#
# Prerequisites before running this:
#   1. Point your domain's A record at this machine's public IP
#   2. Edit Caddyfile and replace "your-domain.com" with that domain
#   3. Open ports 80 and 443 in your EC2 security group (see docs/DEPLOY.md)

services:
  gateway:
    environment:
      CORS_ORIGIN: https://your-domain.com   # update to match your real domain

  frontend:
    build:
      args:
        VITE_API_URL: /api   # same-origin via Caddy — no CORS needed

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - frontend
    networks: [public]

volumes:
  caddy-data:
  caddy-config:
