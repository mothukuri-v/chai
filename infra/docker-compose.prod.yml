# Production overlay — adds a Caddy reverse proxy with automatic HTTPS and stops
# publishing the gateway/frontend ports directly to the host, since Caddy is now the
# only public entry point. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Prerequisites before running this:
#   1. Point your domain's A record at this machine's public IP
#   2. Edit Caddyfile and replace "your-domain.com" with that domain
#   3. Open ports 80 and 443 in your EC2 security group (see docs/DEPLOY.md)

services:
  gateway:
    ports: []          # no longer published to the host — only Caddy/frontend reach it, over the internal/public docker network
    build:
      args:
        NODE_ENV: production

  frontend:
    ports: []          # no longer published directly — Caddy proxies to it instead
    build:
      args:
        VITE_API_URL: /api   # same-origin via Caddy, so a relative path works — no CORS needed

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - frontend
    networks: [public]

volumes:
  caddy-data:
  caddy-config:
