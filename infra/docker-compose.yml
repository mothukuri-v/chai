services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10
    expose: ["27017"]
    networks: [internal]

  business-service:
    build: ../business-service
    environment:
      MONGO_URI: mongodb://mongo:27017/chaipass?replicaSet=rs0
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      QR_JWT_SECRET: ${QR_JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    expose: ["8080"]
    networks:
      - internal

  gateway:
    build: ../gateway
    environment:
      MONGO_URI: mongodb://mongo:27017/chaipass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      BUSINESS_SERVICE_URL: http://business-service:8080/internal
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    expose: ["4000"]
    depends_on:
      - business-service
      - mongo
    networks:
      - internal
      - public

  frontend:
    build: ../frontend
    expose: ["80"]
    depends_on: [gateway]
    networks: [public]

networks:
  internal:
  public:

volumes:
  mongo-data:
